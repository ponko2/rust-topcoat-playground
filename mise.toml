[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"aqua:owenlamont/ryl" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-shear" = "latest"
"cargo:cargo-sort" = "latest"
"npm:@commitlint/cli" = "latest"
cargo-binstall = "latest"
editorconfig-checker = "latest"
hk = "latest"
jactionlint = "latest"
mr-boxington = "latest"
oxfmt = "latest"
rust-analyzer = "latest"
shellcheck = "latest"

[tools."cargo:cargo-features-manager"]
version = "latest"
lazy = true
lazy_bins = ["cargo-features"]

[tools."cargo:topcoat-cli"]
version = "latest"
lazy = true
lazy_bins = ["topcoat"]

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }
