[package]
name = "rust-topcoat-playground"
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = "0.5.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
